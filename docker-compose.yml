services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: cbtm
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    restart: unless-stopped
    environment:
      API_PORT: 4000
      FRONTEND_URL: http://localhost:3000
      JWT_SECRET: changeme
      JWT_EXPIRES_IN: 8h
      ADMIN_USERNAME: mush1n-d0sh4
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/cbtm
      REDIS_URL: redis://redis:6379
    depends_on:
      - postgres
      - redis
    ports:
      - "4000:4000"

  worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/cbtm
      REDIS_URL: redis://redis:6379
      SCRAPER_MODE: live
      SCRAPER_EVENT_URL: https://app.cbtm.org.br/IUI/App/Evento?EVE_Evento_ID={EVENT_ID}
      SCRAPER_FIXTURE_PATH: /workspace/fixtures/results.txt
      SCRAPER_FIXTURE_PATHS: /workspace/fixtures/golden
      SCRAPER_EXCLUDED_CATEGORY_IDS: 88888888,99999999
      SCRAPE_CAPTURE_TIMEOUT_MS: 900000
      SCRAPE_LOCK_STALE_MS: 900000
      SCRAPER_REFRESH_CRON_MS: 7200000
      SCRAPER_HEADLESS: true
    depends_on:
      - postgres
      - redis

  frontend:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  postgres_data:

