services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    stop_grace_period: 90s
    command:
      - postgres
      - -c
      - max_connections=80
      - -c
      - shared_buffers=512MB
      - -c
      - checkpoint_timeout=15min
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - max_wal_size=4GB
      - -c
      - wal_compression=on
    environment:
      POSTGRES_DB: cbtm
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no ambiente ou arquivo .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cbtm"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - postgres-tier
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Defina REDIS_PASSWORD no ambiente ou arquivo .env}
    command:
      - /bin/sh
      - -ec
      - |
        exec redis-server \
          --appendonly yes \
          --tcp-backlog 511 \
          --save 300 100 \
          --save 60 10000 \
          --maxmemory 256mb \
          --maxmemory-policy noeviction \
          --requirepass "$$REDIS_PASSWORD"
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - redis-tier
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      ALLOW_INSECURE_DEV_AUTH_DEFAULTS: ${ALLOW_INSECURE_DEV_AUTH_DEFAULTS:-false}
      API_PORT: 4000
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      FRONTEND_ALLOW_VERCEL_PREVIEWS: ${FRONTEND_ALLOW_VERCEL_PREVIEWS:-false}
      TRUST_PROXY: "1"
      RATE_LIMIT_WINDOW_MS: 60000
      RATE_LIMIT_DEFAULT_LIMIT: 600
      RATE_LIMIT_HEAVY_LIMIT: 120
      RATE_LIMIT_STRICT_LIMIT: 40
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET no ambiente ou arquivo .env}
      JWT_EXPIRES_IN: 8h
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin-local}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:?Defina ADMIN_PASSWORD_HASH no ambiente ou arquivo .env}
      USER_LIST_DEFAULT_PAGE_SIZE: 200
      USER_LIST_MAX_PAGE_SIZE: 500
      STATE_CIRCUIT_ELIGIBILITY_CACHE_TTL_MS: 300000
      HEALTH_MONITOR_INTERVAL_MS: 60000
      HEALTH_MONITOR_RECOVERY_COOLDOWN_MS: 1800000
      HEALTH_MONITOR_RECOVERY_MAX_EVENTS_PER_CYCLE: 1
      HEALTH_MONITOR_RECOVERY_MAX_ATTEMPTS_PER_EVENT: 6
      HEALTH_MONITOR_RECOVERY_ESCALATE_AFTER_CONSECUTIVE_DEGRADED: 2
      HEALTH_MONITOR_RECOVERY_ATTEMPT_WINDOW_MS: 21600000
      SCRAPE_INTERVAL_PRE_INSCRICOES_MS: 18000000
      SCRAPE_INTERVAL_INSCRICOES_ABERTAS_MS: 21600000
      SCRAPE_INTERVAL_POS_INSCRICOES_PRE_EVENTO_MS: 3600000
      SCRAPE_INTERVAL_GRADES_PUBLICADAS_PRE_JOGO_MS: 1200000
      SCRAPE_INTERVAL_EM_ANDAMENTO_MS: 900000
      NODE_OPTIONS: --max-old-space-size=768
      DATABASE_URL_WRITE: ${API_DATABASE_URL_WRITE:?Defina API_DATABASE_URL_WRITE no ambiente ou arquivo .env}
      DATABASE_URL_READ: ${API_DATABASE_URL_READ:?Defina API_DATABASE_URL_READ no ambiente ou arquivo .env}
      DATABASE_URL: ${API_DATABASE_URL_WRITE:?Defina API_DATABASE_URL_WRITE no ambiente ou arquivo .env}
      REDIS_URL: ${REDIS_URL:?Defina REDIS_URL autenticada no ambiente ou arquivo .env}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:4000:4000"
    networks:
      - postgres-tier
      - redis-tier
      - app-tier
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 25s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL_WRITE: ${WORKER_DATABASE_URL_WRITE:?Defina WORKER_DATABASE_URL_WRITE no ambiente ou arquivo .env}
      DATABASE_URL_READ: ${WORKER_DATABASE_URL_READ:?Defina WORKER_DATABASE_URL_READ no ambiente ou arquivo .env}
      DATABASE_URL: ${WORKER_DATABASE_URL_WRITE:?Defina WORKER_DATABASE_URL_WRITE no ambiente ou arquivo .env}
      REDIS_URL: ${REDIS_URL:?Defina REDIS_URL autenticada no ambiente ou arquivo .env}
      SCRAPER_MODE: live
      SCRAPER_EVENT_URL: https://app.cbtm.org.br/IUI/App/Evento?EVE_Evento_ID={EVENT_ID}
      SCRAPER_FIXTURE_PATH: /workspace/fixtures/results.txt
      SCRAPER_FIXTURE_PATHS: /workspace/fixtures/golden
      SCRAPER_EXCLUDED_CATEGORY_IDS: 88888888,99999999
      SCRAPE_CAPTURE_TIMEOUT_MS: 900000
      SCRAPE_LOCK_STALE_MS: 900000
      SCRAPER_REFRESH_CRON_MS: 600000
      SCRAPER_AUTO_SCRAPE_MAX_PENDING_JOBS: 20
      SCRAPE_RUN_RETENTION_LIMIT: 5
      SCRAPE_RUN_RETENTION_DAYS: 45
      SCRAPER_HEADLESS: "true"
      READ_MODEL_PREWARM_API_BASE_URL: http://api:4000
      READ_MODEL_PREWARM_ATHLETE_LIMIT: 100
      READ_MODEL_PREWARM_CONCURRENCY: 3
      READ_MODEL_PREWARM_TIMEOUT_MS: 10000
      REGISTRATION_CANCELLED_CATEGORY_MAX_ENTRANTS: 2
      SCRAPE_INTERVAL_PRE_INSCRICOES_MS: 18000000
      SCRAPE_INTERVAL_INSCRICOES_ABERTAS_MS: 21600000
      SCRAPE_INTERVAL_POS_INSCRICOES_PRE_EVENTO_MS: 3600000
      SCRAPE_INTERVAL_GRADES_PUBLICADAS_PRE_JOGO_MS: 1200000
      SCRAPE_INTERVAL_EM_ANDAMENTO_MS: 900000
      SCRAPE_STRICT_QUALITY_GATE_ENABLED: "true"
      SCRAPE_STRICT_REQUIRE_ZERO_PENDING_CONFLICTS: "true"
      SCRAPE_STRICT_REQUIRE_ZERO_NO_CANDIDATE_CONFLICTS: "true"
      SCRAPE_STRICT_REQUIRE_CONFORMANCE: "true"
      SCRAPE_PERSISTED_WARNINGS_MAX: 60
      SCRAPE_PERSISTED_WARNINGS_HIGH_MAX: 15
      SCRAPE_PERSISTED_WARNINGS_MEDIUM_MAX: 20
      DB_RETRY_ATTEMPTS: 5
      DB_RETRY_DELAY_MS: 1000
      NODE_OPTIONS: --max-old-space-size=1536
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - postgres-tier
      - redis-tier
      - app-tier
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  frontend:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    restart: unless-stopped
    profiles:
      - local-ui
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
      API_INTERNAL_URL: http://api:4000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:3000"
    networks:
      - app-tier
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

networks:
  postgres-tier:
  redis-tier:
  app-tier:

volumes:
  postgres_data:
