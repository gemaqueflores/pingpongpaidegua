server {
  listen 80;
  server_name api-pingpongpaidegua.duckdns.org;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/letsencrypt;
    default_type "text/plain";
    try_files $uri =404;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  server_name api-pingpongpaidegua.duckdns.org;

  ssl_certificate     /etc/letsencrypt/live/api-pingpongpaidegua.duckdns.org/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/api-pingpongpaidegua.duckdns.org/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_timeout 1d;
  ssl_session_cache shared:SSL:20m;

  # Cap de conexoes simultaneas por IP para reduzir risco de DoS.
  limit_conn api_conn_per_ip 120;
  limit_conn_status 429;
  limit_req_status 429;

  # Endpoints pesados recebem microcache mais agressivo para estabilidade sob pico.
  location ~* ^/events/[0-9]+/(efficiency|medalists)$ {
    limit_req zone=api_per_ip burst=80 nodelay;

    proxy_cache api_microcache;
    proxy_cache_methods GET HEAD;
    proxy_cache_key "$scheme$request_method$host$request_uri";
    proxy_cache_lock on;
    proxy_cache_lock_timeout 5s;
    proxy_cache_valid 200 20s;
    proxy_cache_use_stale error timeout invalid_header updating http_429 http_500 http_502 http_503 http_504;
    proxy_cache_background_update on;
    proxy_ignore_headers Set-Cookie Cache-Control Expires;
    add_header X-Proxy-Cache $upstream_cache_status always;

    proxy_pass http://127.0.0.1:4000;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering on;
    proxy_buffers 32 16k;
    proxy_busy_buffers_size 64k;

    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    send_timeout 30s;
  }

  location / {
    # Limite por IP na borda para absorver burst sem sobrecarregar API.
    limit_req zone=api_per_ip burst=120 nodelay;

    proxy_cache api_microcache;
    proxy_cache_methods GET HEAD;
    proxy_cache_key "$scheme$request_method$host$request_uri";
    proxy_cache_lock on;
    proxy_cache_lock_timeout 3s;
    proxy_cache_valid 200 5s;
    proxy_cache_use_stale error timeout invalid_header updating http_500 http_502 http_503 http_504;
    proxy_cache_background_update on;
    proxy_ignore_headers Set-Cookie;
    add_header X-Proxy-Cache $upstream_cache_status always;

    proxy_pass http://127.0.0.1:4000;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering on;
    proxy_buffers 32 16k;
    proxy_busy_buffers_size 64k;

    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    send_timeout 30s;
  }
}
