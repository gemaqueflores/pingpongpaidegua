server {
  listen 80;
  server_name api-pingpongpaidegua.duckdns.org;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/letsencrypt;
    default_type "text/plain";
    try_files $uri =404;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  server_name api-pingpongpaidegua.duckdns.org;

  ssl_certificate     /etc/letsencrypt/live/api-pingpongpaidegua.duckdns.org/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/api-pingpongpaidegua.duckdns.org/privkey.pem;

  # Cap de conexoes simultaneas por IP para reduzir risco de DoS.
  limit_conn api_conn_per_ip 120;

  location / {
    # Limite por IP na borda para absorver burst sem sobrecarregar API.
    limit_req zone=api_per_ip burst=240 nodelay;

    proxy_cache api_microcache;
    proxy_cache_methods GET HEAD;
    proxy_cache_lock on;
    proxy_cache_valid 200 5s;
    proxy_cache_use_stale error timeout invalid_header updating http_500 http_502 http_503 http_504;
    proxy_cache_background_update on;
    proxy_ignore_headers Set-Cookie;
    add_header X-Proxy-Cache $upstream_cache_status always;

    proxy_pass http://127.0.0.1:4000;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    send_timeout 30s;
  }
}
