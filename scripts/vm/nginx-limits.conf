# Zonas globais de limite por IP para API publica.
limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=40r/s;
limit_conn_zone $binary_remote_addr zone=api_conn_per_ip:10m;

# Microcache para aliviar picos de leitura publica.
proxy_cache_path /var/cache/nginx/api_microcache levels=1:2 keys_zone=api_microcache:50m max_size=512m inactive=30s use_temp_path=off;
