name: Scrape Events Every 2h

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:
    inputs:
      event_ids:
        description: "IDs de eventos separados por virgula (opcional)"
        required: false
        default: ""

jobs:
  scrape-on-vm:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SCRAPE_EVENT_IDS: ${{ github.event.inputs.event_ids }}
    steps:
      - name: Validar secrets de SSH
        run: |
          test -n "${{ secrets.ORACLE_SSH_HOST }}"
          test -n "${{ secrets.ORACLE_SSH_USER }}"
          test -n "${{ secrets.ORACLE_SSH_PRIVATE_KEY }}"

      - name: Rodar scrape remoto na VM Oracle
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.ORACLE_SSH_HOST }}
          username: ${{ secrets.ORACLE_SSH_USER }}
          key: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
          port: ${{ secrets.ORACLE_SSH_PORT || 22 }}
          script_stop: true
          envs: SCRAPE_EVENT_IDS
          script: |
            set -e
            APP_DIR="${{ secrets.ORACLE_APP_DIR }}"
            if [ -z "$APP_DIR" ]; then
              APP_DIR="$HOME/pingpongpaidegua"
            fi

            cd "$APP_DIR"

            if command -v docker >/dev/null 2>&1; then
              if docker compose version >/dev/null 2>&1; then
                COMPOSE_BIN="docker compose"
              elif command -v docker-compose >/dev/null 2>&1; then
                COMPOSE_BIN="docker-compose"
              else
                echo "Docker Compose nao encontrado na VM."
                exit 1
              fi
            else
              echo "Docker nao encontrado na VM."
              exit 1
            fi

            $COMPOSE_BIN up -d postgres redis worker

            if [ -n "$SCRAPE_EVENT_IDS" ]; then
              $COMPOSE_BIN exec -T -e SCRAPE_EVENT_IDS="$SCRAPE_EVENT_IDS" worker node apps/worker/dist/run-once.js
            else
              $COMPOSE_BIN exec -T worker node apps/worker/dist/run-once.js
            fi

            $COMPOSE_BIN logs --tail=80 worker
