name: Scrape Events Every 30m

permissions:
  contents: read

concurrency:
  group: scrape-on-vm
  cancel-in-progress: false

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      event_ids:
        description: "IDs de eventos separados por virgula (opcional)"
        required: false
        default: ""

jobs:
  scrape-on-vm:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SCRAPE_EVENT_IDS: ${{ github.event.inputs.event_ids }}
    steps:
      - name: Validar secrets de SSH
        id: precheck
        env:
          ORACLE_SSH_HOST: ${{ secrets.ORACLE_SSH_HOST }}
          ORACLE_SSH_USER: ${{ secrets.ORACLE_SSH_USER }}
          ORACLE_SSH_PRIVATE_KEY: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
          ORACLE_SSH_PORT: ${{ secrets.ORACLE_SSH_PORT }}
        run: |
          set -euo pipefail
          missing=()

          [ -n "$ORACLE_SSH_HOST" ] || missing+=("ORACLE_SSH_HOST")
          [ -n "$ORACLE_SSH_USER" ] || missing+=("ORACLE_SSH_USER")
          [ -n "$ORACLE_SSH_PRIVATE_KEY" ] || missing+=("ORACLE_SSH_PRIVATE_KEY")

          if [ "${#missing[@]}" -gt 0 ]; then
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              echo "Secrets ausentes/vazios: ${missing[*]}"
              exit 1
            fi
            echo "Secrets ausentes no agendamento (${missing[*]}). Scrape sera ignorado sem falha."
            echo "can_run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          mkdir -p ~/.ssh
          printf '%s\n' "$ORACLE_SSH_PRIVATE_KEY" > ~/.ssh/oracle_vm_key
          chmod 600 ~/.ssh/oracle_vm_key
          SSH_PORT="${ORACLE_SSH_PORT:-22}"
          if ! ssh -i ~/.ssh/oracle_vm_key -p "$SSH_PORT" -o ConnectTimeout=10 -o BatchMode=yes -o StrictHostKeyChecking=accept-new "$ORACLE_SSH_USER@$ORACLE_SSH_HOST" "echo ok" >/dev/null 2>&1; then
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              echo "Falha de conectividade SSH com a VM."
              exit 1
            fi
            echo "VM indisponivel para SSH no agendamento. Scrape sera ignorado sem falha."
            echo "can_run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Secrets obrigatorios de SSH OK."
          echo "can_run=true" >> "$GITHUB_OUTPUT"

      - name: Rodar scrape remoto na VM Oracle
        if: steps.precheck.outputs.can_run == 'true'
        continue-on-error: ${{ github.event_name == 'schedule' }}
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.ORACLE_SSH_HOST }}
          username: ${{ secrets.ORACLE_SSH_USER }}
          key: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
          port: ${{ secrets.ORACLE_SSH_PORT || 22 }}
          command_timeout: 60m
          script_stop: true
          envs: SCRAPE_EVENT_IDS
          script: |
            set -eo pipefail
            APP_DIR="${{ secrets.ORACLE_APP_DIR }}"
            if [ -z "$APP_DIR" ]; then
              APP_DIR="$HOME/pingpongpaidegua"
            fi
            export COMPOSE_PROJECT_NAME="pingpongpaidegua"

            cd "$APP_DIR"
            echo "Diretorio da aplicacao: $APP_DIR"

            if command -v docker >/dev/null 2>&1; then
              if command -v docker-compose >/dev/null 2>&1; then
                COMPOSE_BIN="docker-compose -p $COMPOSE_PROJECT_NAME"
              elif docker compose version >/dev/null 2>&1; then
                COMPOSE_BIN="docker compose -p $COMPOSE_PROJECT_NAME"
              else
                echo "Docker Compose nao encontrado na VM."
                exit 1
              fi
            else
              echo "Docker nao encontrado na VM."
              exit 1
            fi

            $COMPOSE_BIN up -d --no-recreate postgres redis
            $COMPOSE_BIN ps

            RUN_ONCE_CMD="node /workspace/apps/worker/dist/run-once.js"
            echo "Comando de run-once: $RUN_ONCE_CMD (one-shot container)"
            echo "Diagnostico rapido do worker (one-shot):"
            $COMPOSE_BIN run --rm --no-deps worker sh -lc "node -v && pwd && ls -la /workspace/apps/worker/dist | sed -n '1,80p'" || true

            echo "Checkpoint: preparando execucao do run-once"
            RUN_ONCE_EXIT=0
            SCRAPE_IDS="${SCRAPE_EVENT_IDS:-}"
            max_attempts=3
            attempt=1
            while [ "$attempt" -le "$max_attempts" ]; do
              set +e
              if [ -n "$SCRAPE_IDS" ]; then
                echo "SCRAPE_EVENT_IDS=$SCRAPE_IDS"
                $COMPOSE_BIN run --rm --no-deps -e SCRAPE_EVENT_IDS="$SCRAPE_IDS" worker sh -lc "$RUN_ONCE_CMD"
                RUN_ONCE_EXIT=$?
              else
                $COMPOSE_BIN run --rm --no-deps worker sh -lc "$RUN_ONCE_CMD"
                RUN_ONCE_EXIT=$?
              fi
              set -e

              if [ "$RUN_ONCE_EXIT" -eq 0 ]; then
                echo "run-once concluido com sucesso na tentativa $attempt."
                break
              fi

              if [ "$attempt" -ge "$max_attempts" ]; then
                echo "run-once falhou apos $attempt tentativa(s)."
                break
              fi

              retry_sleep=$((attempt * 20))
              echo "run-once falhou (tentativa $attempt/$max_attempts, exit=$RUN_ONCE_EXIT). Repetindo em ${retry_sleep}s..."
              sleep "$retry_sleep"
              attempt=$((attempt + 1))
            done

            echo "Checkpoint: execucao finalizada"
            echo "run-once exit code: $RUN_ONCE_EXIT"
            $COMPOSE_BIN logs --tail=200 worker || true

            if [ "$RUN_ONCE_EXIT" -ne 0 ]; then
              if [ "${{ github.event_name }}" = "schedule" ]; then
                echo "run-once falhou no agendamento (exit=$RUN_ONCE_EXIT). Marcando como aviso para evitar ruido operacional."
                exit 0
              fi
              echo "Falha no run-once remoto. Veja logs acima."
              exit "$RUN_ONCE_EXIT"
            fi

      - name: Pos-scrape e sanity check (VM)
        if: always() && steps.precheck.outputs.can_run == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.ORACLE_SSH_HOST }}
          username: ${{ secrets.ORACLE_SSH_USER }}
          key: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
          port: ${{ secrets.ORACLE_SSH_PORT || 22 }}
          command_timeout: 10m
          script_stop: false
          script: |
            set +e
            APP_DIR="${{ secrets.ORACLE_APP_DIR }}"
            if [ -z "$APP_DIR" ]; then
              APP_DIR="$HOME/pingpongpaidegua"
            fi
            export COMPOSE_PROJECT_NAME="pingpongpaidegua"
            cd "$APP_DIR"
            if command -v docker-compose >/dev/null 2>&1; then
              COMPOSE_BIN="docker-compose -p $COMPOSE_PROJECT_NAME"
            elif docker compose version >/dev/null 2>&1; then
              COMPOSE_BIN="docker compose -p $COMPOSE_PROJECT_NAME"
            else
              echo "Compose indisponivel no diagnostico."
              exit 0
            fi
            $COMPOSE_BIN ps || true
            curl -fsS http://localhost:4000/ || true
            $COMPOSE_BIN exec -T worker sh -lc "cd /workspace && npm run ops:autonomy-check -- --json"
            rc=$?
            if [ "$rc" -ne 0 ] && [ "${{ github.event_name }}" = "schedule" ]; then
              echo "Sanity check retornou rc=$rc no agendamento; mantendo como aviso."
              exit 0
            fi
            exit "$rc"

      - name: Falha da automacao de scrape
        if: failure() && steps.precheck.outputs.can_run == 'true' && github.event_name == 'workflow_dispatch'
        run: |
          echo "Workflow de scrape falhou."
          echo "Revise logs do passo SSH e do diagnostico de saude."
          exit 1
