name: Scrape Events Every 2h

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:
    inputs:
      event_ids:
        description: "IDs de eventos separados por virgula (opcional)"
        required: false
        default: ""

jobs:
  scrape-on-vm:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SCRAPE_EVENT_IDS: ${{ github.event.inputs.event_ids }}
    steps:
      - name: Validar secrets de SSH
        env:
          ORACLE_SSH_HOST: ${{ secrets.ORACLE_SSH_HOST }}
          ORACLE_SSH_USER: ${{ secrets.ORACLE_SSH_USER }}
          ORACLE_SSH_PRIVATE_KEY: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
        run: |
          set -e
          missing=()

          [ -n "$ORACLE_SSH_HOST" ] || missing+=("ORACLE_SSH_HOST")
          [ -n "$ORACLE_SSH_USER" ] || missing+=("ORACLE_SSH_USER")
          [ -n "$ORACLE_SSH_PRIVATE_KEY" ] || missing+=("ORACLE_SSH_PRIVATE_KEY")

          if [ "${#missing[@]}" -gt 0 ]; then
            echo "Secrets ausentes/vazios: ${missing[*]}"
            echo "Configure em Settings > Secrets and variables > Actions."
            exit 1
          fi

          echo "Secrets obrigatorios de SSH OK."

      - name: Rodar scrape remoto na VM Oracle
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.ORACLE_SSH_HOST }}
          username: ${{ secrets.ORACLE_SSH_USER }}
          key: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
          port: ${{ secrets.ORACLE_SSH_PORT || 22 }}
          command_timeout: 45m
          script_stop: true
          envs: SCRAPE_EVENT_IDS
          script: |
            set -eo pipefail
            APP_DIR="${{ secrets.ORACLE_APP_DIR }}"
            if [ -z "$APP_DIR" ]; then
              APP_DIR="$HOME/pingpongpaidegua"
            fi

            cd "$APP_DIR"
            echo "Diretorio da aplicacao: $APP_DIR"

            if command -v docker >/dev/null 2>&1; then
              if command -v docker-compose >/dev/null 2>&1; then
                COMPOSE_BIN="docker-compose"
              elif docker compose version >/dev/null 2>&1; then
                COMPOSE_BIN="docker compose"
              else
                echo "Docker Compose nao encontrado na VM."
                exit 1
              fi
            else
              echo "Docker nao encontrado na VM."
              exit 1
            fi

            $COMPOSE_BIN up -d postgres redis worker
            $COMPOSE_BIN ps

            RUN_ONCE_CMD="node apps/worker/dist/run-once.js"
            if ! $COMPOSE_BIN exec -T worker test -f apps/worker/dist/run-once.js; then
              RUN_ONCE_CMD="npm run scrape:once"
            fi

            echo "Comando de run-once: $RUN_ONCE_CMD"
            echo "Diagnostico rapido do worker:"
            $COMPOSE_BIN exec -T worker sh -lc "node -v && pwd && ls -la apps/worker/dist | sed -n '1,80p'" || true

            echo "Checkpoint: preparando execucao do run-once"
            RUN_ONCE_EXIT=0
            SCRAPE_IDS="${SCRAPE_EVENT_IDS:-}"
            set +e
            if [ -n "$SCRAPE_IDS" ]; then
              echo "SCRAPE_EVENT_IDS=$SCRAPE_IDS"
              $COMPOSE_BIN exec -T -e SCRAPE_EVENT_IDS="$SCRAPE_IDS" worker sh -lc "$RUN_ONCE_CMD"
              RUN_ONCE_EXIT=$?
            else
              $COMPOSE_BIN exec -T worker sh -lc "$RUN_ONCE_CMD"
              RUN_ONCE_EXIT=$?
            fi

            if [ "$RUN_ONCE_EXIT" -ne 0 ]; then
              echo "Primeira tentativa do run-once falhou (exit=$RUN_ONCE_EXIT). Tentando novamente em 15s..."
              sleep 15
              if [ -n "$SCRAPE_IDS" ]; then
                $COMPOSE_BIN exec -T -e SCRAPE_EVENT_IDS="$SCRAPE_IDS" worker sh -lc "$RUN_ONCE_CMD"
                RUN_ONCE_EXIT=$?
              else
                $COMPOSE_BIN exec -T worker sh -lc "$RUN_ONCE_CMD"
                RUN_ONCE_EXIT=$?
              fi
            fi
            set -e

            echo "Checkpoint: execucao finalizada"
            echo "run-once exit code: $RUN_ONCE_EXIT"
            $COMPOSE_BIN logs --tail=200 worker || true

            if [ "$RUN_ONCE_EXIT" -ne 0 ]; then
              echo "Falha no run-once remoto. Veja logs acima."
              exit "$RUN_ONCE_EXIT"
            fi
