name: Scrape Events Every 2h

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:
    inputs:
      event_ids:
        description: "IDs de eventos separados por virgula (opcional)"
        required: false
        default: ""

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      NODE_ENV: production
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SCRAPER_MODE: live
      SCRAPER_HEADLESS: "true"
      SCRAPER_REFRESH_CRON_MS: "7200000"
      SCRAPE_EVENT_IDS: ${{ github.event.inputs.event_ids }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Prisma generate
        run: npm run prisma:generate

      - name: Build shared packages
        run: |
          npm run build --workspace @cbtm/shared
          npm run build --workspace @cbtm/parser

      - name: Run scrape once
        run: npm run scrape:once --workspace apps/worker

