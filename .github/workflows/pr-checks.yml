name: PR Checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/cbtm_test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: cbtm_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci -d cbtm_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run prisma:generate
      - run: npm run prisma:deploy
      - name: Unit tests (API, worker, shared, parser)
        run: npm test
      - name: Web tests (previously omitted)
        run: npm run test --workspace apps-web
      - run: npx tsx --test scripts/audit-gate.test.ts
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Audit completo (bloqueia somente Critico)
        shell: bash
        run: |
          set -euo pipefail
          audit_status=0
          npm audit --json > audit-report.json || audit_status=$?
          npx tsx scripts/audit-gate.ts "$audit_status" < audit-report.json
  gate:
    name: gate
    if: always()
    needs: [test, audit]
    runs-on: ubuntu-latest
    steps:
      - name: Require all mandatory checks
        env:
          TEST: ${{ needs.test.result }}
          AUDIT: ${{ needs.audit.result }}
        run: |
          test "$TEST" = success
          test "$AUDIT" = success
