name: Validate Update Post Commit

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate-prod:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate production API
        env:
          PROD_API_URL: ${{ secrets.PROD_API_URL }}
          VALIDATE_EVENT_ID: ${{ vars.VALIDATE_EVENT_ID }}
        run: npm run validate:update:prod