name: Validate Update Post Commit

permissions:
  contents: read

concurrency:
  group: validate-prod-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate-prod:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate production API
        env:
          VALIDATE_EVENT_ID: ${{ vars.VALIDATE_EVENT_ID }}
        run: |
          set -euo pipefail
          attempt=1
          max_attempts=3
          while [ "$attempt" -le "$max_attempts" ]; do
            set +e
            npm run validate:update:prod
            rc=$?
            set -e
            if [ "$rc" -eq 0 ]; then
              echo "Validacao de producao concluida na tentativa $attempt."
              exit 0
            fi
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "Validacao de producao falhou apos $attempt tentativa(s)."
              exit "$rc"
            fi
            retry_sleep=$((attempt * 15))
            echo "Validacao falhou (tentativa $attempt/$max_attempts). Repetindo em ${retry_sleep}s..."
            sleep "$retry_sleep"
            attempt=$((attempt + 1))
          done
